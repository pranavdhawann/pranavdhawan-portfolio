[build]
command = "node scripts/build-site.mjs"
publish = "public"

[functions]
directory = "netlify/functions"

[[headers]]
for = "/*"
[headers.values]
Content-Security-Policy = "default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://pranavdhawan.goatcounter.com; script-src 'self' https://gc.zgo.at; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https://pranavdhawan.goatcounter.com; report-uri /.netlify/functions/csp-report"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"

# Fonts are copied from versions locked in package-lock.json and never change
# under these names without a deliberate bump.
[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Image filenames are unhashed, so keep the hard cache short and let the CDN
# revalidate in the background; a replaced photo shows up within a day.
[[headers]]
for = "/images/*"
[headers.values]
Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Social cards and feed readers fetch these cross-origin.
[[headers]]
for = "/images/og-card.png"
[headers.values]
Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
for = "/blog/feed.xml"
[headers.values]
Cross-Origin-Resource-Policy = "cross-origin"
