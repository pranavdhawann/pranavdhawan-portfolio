[build]
command = "node scripts/build-site.mjs"
publish = "public"

[functions]
directory = "netlify/functions"

[[headers]]
for = "/*"
[headers.values]
Content-Security-Policy = "default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://pranavdhawan.goatcounter.com; script-src 'self' https://gc.zgo.at; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https://pranavdhawan.goatcounter.com; report-uri /.netlify/functions/csp-report"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"

# Filenames are unhashed, so long caches lean on Netlify's etag revalidation —
# except fonts, which are immutable content copied from pinned packages.
[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/images/*"
[headers.values]
Cache-Control = "public, max-age=2592000"
