name: Update AI news digest

on:
  schedule:
    # Every Monday at 06:15 UTC — see docs/ai-news-pipeline.md
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and generate digest
        run: node scripts/fetch-ai-news.mjs
        env:
          # Optional: raises the GitHub search API rate limit for the
          # trending-repos source. The default token is enough here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated HTML
        run: |
          npm ci
          npm run test:html

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain blog/)" ]; then
            echo "No new items this week — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add blog/index.html blog/data/ai-news.json
          git commit -m "chore: weekly AI news digest ($(date -u +%Y-%m-%d))"
          git push

      # Emails the digest to Netlify Forms subscribers. Skips cleanly until
      # the secrets below are configured — see docs/ai-news-pipeline.md.
      - name: Send newsletter
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          NEWSLETTER_ADDRESS: ${{ secrets.NEWSLETTER_ADDRESS }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
        run: node scripts/send-newsletter.mjs

      - name: Commit newsletter state
        run: |
          if [ -z "$(git status --porcelain blog/data/newsletter-state.json)" ]; then
            echo "Newsletter state unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add blog/data/newsletter-state.json
          git commit -m "chore: newsletter sent ($(date -u +%Y-%m-%d)) [skip ci]"
          git push
