name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency advisories
        run: npm audit --audit-level=high

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run project verification
        run: npm run check

      - name: Build production site
        run: npm run build

      # openai.com is excluded by host, not by URL: the weekly digest pulls in
      # new openai.com links and they 403 datacenter IPs, so a per-URL list
      # would break CI again every time a new OpenAI story lands.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose --exclude https://linkedin.com/in/pranavvdhawann --exclude https://www.linkedin.com/in/pranavvdhawann --exclude https://app.joinhandshake.com/profiles/pranavvdhawann --exclude https://openai.com/ --exclude https://pranavdhawan.com/privacy.html --exclude https://pranavdhawan.goatcounter.com --exclude https://www.goatcounter.com --accept 200,204,206,301,302,429 public/index.html public/blog/*.html public/privacy.html README.md
