name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate HTML
        run: npm run test:html

      - name: Check Netlify security headers
        run: npm run check:headers

      - name: Run Playwright and axe smoke tests
        run: npm test

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # 403 is accepted because several lab sites (openai.com, anthropic.com)
          # serve bot walls to CI runners; dead links still fail via 404/timeouts.
          args: --no-progress --verbose --exclude https://linkedin.com/in/pranavvdhawann --exclude https://www.linkedin.com/in/pranavvdhawann --exclude https://app.joinhandshake.com/profiles/pranavvdhawann --accept 200,204,206,301,302,403,429 index.html README.md blog/index.html blog/rag-hallucinations.html blog/multimodal-finding.html
