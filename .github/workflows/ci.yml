name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate HTML
        run: npm run test:html

      - name: Check Netlify security headers
        run: npm run check:headers

      - name: Run Playwright and axe smoke tests
        run: npm test

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Mail links are excluded by default since lychee v0.16 (--exclude-mail was removed in v0.23)
          args: --no-progress --verbose --accept 200,204,206,301,302,429 index.html README.md
